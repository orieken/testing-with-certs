global
  maxconn 256
  ssl-default-bind-options ssl-min-ver TLSv1.2
  ssl-default-server-options ssl-min-ver TLSv1.2

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend shop
  bind :8443 ssl crt /shop/combined.pem ca-file /trust/user-ca.pem crl-file /trust/user.crl.pem verify required
  http-request del-header X-Cert-Identity
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Proto
  http-request del-header Forwarded
  http-request set-header X-Cert-Identity %[ssl_c_s_dn(CN)]
  http-request deny deny_status 404 if { path_beg /internal }
  acl catalog_path path_beg /api/catalog/
  acl customer_path path_beg /api/customer/
  acl insights_path path_beg /api/insights/
  http-request return status 404 if { path_beg /api/ } !catalog_path !customer_path !insights_path
  use_backend catalog if catalog_path
  use_backend customer if customer_path
  use_backend insights if insights_path
  default_backend ui

frontend teaching
  bind :8543 ssl crt /shop/combined.pem
  http-request del-header X-Cert-Identity
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Proto
  http-request del-header Forwarded
  acl lesson_path path -m str / /teaching /teaching/password-otp /teaching/password-otp/callback
  acl lesson_path path -m str /teaching/passkeys /teaching/passkeys/callback /teaching/passkeys/enroll /teaching/passkeys/enroll/callback
  acl lesson_path path -m str /teaching/oidc /teaching/oidc/callback /teaching/saml /teaching/saml/callback /teaching/kerberos /teaching/kerberos/callback
  acl lesson_path path -m str /teaching/authentik-oidc /teaching/authentik-oidc/callback /teaching/authentik-saml /teaching/authentik-saml/callback
  acl asset_path path_beg /assets/
  http-request return status 404 unless lesson_path or asset_path
  default_backend ui

backend ui
  server ui ui:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost ui sni str(ui) resolvers docker init-addr libc,none resolve-prefer ipv4

backend catalog
  server catalog catalog-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost catalog-api sni str(catalog-api) resolvers docker init-addr libc,none resolve-prefer ipv4

backend customer
  server customer customer-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost customer-api sni str(customer-api) resolvers docker init-addr libc,none resolve-prefer ipv4

backend insights
  server insights insights-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost insights-api sni str(insights-api) resolvers docker init-addr libc,none resolve-prefer ipv4

frontend authentication
  mode tcp
  bind :9443
  default_backend keycloak

backend keycloak
  mode tcp
  server keycloak keycloak:8443 resolvers docker init-addr libc,none resolve-prefer ipv4

frontend lesson_provider
  mode tcp
  bind :9643
  default_backend lesson_provider

backend lesson_provider
  mode tcp
  server provider lesson-provider:8443 resolvers docker init-addr libc,none resolve-prefer ipv4

frontend management
  bind 127.0.0.1:9000
  http-request return status 200 content-type text/plain string "UP" if { path /health/ready }
  http-request return status 404

frontend authentik_lesson_provider
  bind :9743 ssl crt /shop/combined.pem
  http-request del-header X-Cert-Identity
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host shop.magic.test:9743
  default_backend authentik_lesson_provider

backend authentik_lesson_provider
  server authentik authentik-server:9000 resolvers docker init-addr libc,none resolve-prefer ipv4

# Test-only server-to-server ID-token relay; not published on a host port.
frontend oidc_token_fixture
  bind :9843 ssl crt /shop/combined.pem
  default_backend oidc_token_fixture

backend oidc_token_fixture
  server fixture oidc-token-fixture:9102 resolvers docker init-addr libc,none resolve-prefer ipv4

frontend oidc_native_key_control
  bind :9853 ssl crt /shop/combined.pem
  default_backend oidc_native_key_control

backend oidc_native_key_control
  server control oidc-key-control:9103 resolvers docker init-addr libc,none resolve-prefer ipv4
