global
  maxconn 256
  ssl-default-bind-options ssl-min-ver TLSv1.2
  ssl-default-server-options ssl-min-ver TLSv1.2

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend shop
  bind :8443 ssl crt /shop/combined.pem ca-file /trust/user-ca.pem crl-file /trust/user.crl.pem verify required
  http-request del-header X-Cert-Identity
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Proto
  http-request del-header Forwarded
  http-request set-header X-Cert-Identity %[ssl_c_s_dn(CN)]
  http-request deny deny_status 404 if { path_beg /internal }
  acl catalog_path path_beg /api/catalog/
  acl customer_path path_beg /api/customer/
  acl insights_path path_beg /api/insights/
  http-request return status 404 if { path_beg /api/ } !catalog_path !customer_path !insights_path
  use_backend catalog if catalog_path
  use_backend customer if customer_path
  use_backend insights if insights_path
  default_backend ui

backend ui
  server ui ui:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost ui sni str(ui) resolvers docker init-addr libc,none resolve-prefer ipv4

backend catalog
  server catalog catalog-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost catalog-api sni str(catalog-api) resolvers docker init-addr libc,none resolve-prefer ipv4

backend customer
  server customer customer-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost customer-api sni str(customer-api) resolvers docker init-addr libc,none resolve-prefer ipv4

backend insights
  server insights insights-api:8443 ssl verify required ca-file /trust/server-ca.pem crt /gateway-client/combined.pem verifyhost insights-api sni str(insights-api) resolvers docker init-addr libc,none resolve-prefer ipv4

frontend authentication
  mode tcp
  bind :9443
  default_backend keycloak

backend keycloak
  mode tcp
  server keycloak keycloak:8443 resolvers docker init-addr libc,none resolve-prefer ipv4

frontend management
  bind 127.0.0.1:9000
  http-request return status 200 content-type text/plain string "UP" if { path /health/ready }
  http-request return status 404
