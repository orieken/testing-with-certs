# Local administrative setup uses Unix peer authentication. All network clients
# must use TLS and a SCRAM secret; no host-wide plaintext exception exists.
local all postgres peer
local all all peer
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
