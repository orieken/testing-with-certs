name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: Run the complete Debian/UBI9 recorded browser matrix for publication
        type: boolean
        default: false
        required: false
      evidence_failure_suite:
        description: Deliberately fail one isolated evidence job to verify cleanup and red gating
        type: choice
        required: false
        default: none
        options: [none, consumer, checkout, reporting, idempotency, regional]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: ${{ matrix.target }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [workspace, spike]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test in the pinned Node container
        env:
          CI_TARGET: ${{ matrix.target }}
        run: docker build --platform linux/amd64 --progress plain --target "$CI_TARGET" -f infra/ci/Containerfile .
      - name: Compare existing OpenAPI surface with pull-request base
        if: matrix.target == 'workspace' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if ! git cat-file -e "$BASE_SHA:contracts/bundled/catalog.json" 2>/dev/null; then
            echo 'Base revision has no canonical contract bundle; this change establishes the first baseline.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/openapi-base"
          git archive "$BASE_SHA" contracts/bundled | tar -x -C "$RUNNER_TEMP/openapi-base"
          docker build --platform linux/amd64 --target base -t magic-shop-ci-base:local -f infra/ci/Containerfile .
          docker run --rm --platform linux/amd64 --entrypoint node \
            -v "$RUNNER_TEMP/openapi-base/contracts/bundled:/base:ro" \
            magic-shop-ci-base:local infra/check-openapi-breaking.mjs /base
      - name: Bound authored Go, TypeScript and Python complexity
        if: matrix.target == 'workspace'
        run: |
          docker build --platform linux/amd64 -t magic-shop-quality:ci -f infra/quality/Containerfile .
          docker run --rm --platform linux/amd64 -v "$PWD:/work:ro" magic-shop-quality:ci

  services:
    name: ${{ matrix.service }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, insights-api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and check the service container
        env:
          CI_SERVICE: ${{ matrix.service }}
        run: docker build --platform linux/amd64 --progress plain -f "services/$CI_SERVICE/Containerfile" .

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate all Compose profiles
        run: docker compose -f infra/compose.yaml --profile '*' config --quiet
      - name: Check service ownership, credential mounts, networks and TLS verification
        run: |
          set -eu
          docker build --platform linux/amd64 --target base -t magic-shop-ci-base:local -f infra/ci/Containerfile .
          docker compose -f infra/compose.yaml --profile '*' config --format json | \
            docker run -i --rm --platform linux/amd64 --entrypoint node -v "$PWD:/work:ro" \
              magic-shop-ci-base:local \
              /work/infra/check-architecture.mjs

  integration:
    name: Isolated contracts, security and real-browser suites
    needs: [javascript, services, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LAB_PROJECT: magic-shop-ci-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_CI_REPORTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the standalone package before starting live services
        run: ./lab test --runner playwright --suite package
      - name: Start isolated healthy Compose stack and bootstrap realm
        run: ./lab up
      - name: Record real browser versions in the container
        run: |
          docker compose -f infra/compose.yaml --profile test build runner-test
          docker compose -f infra/compose.yaml --profile test run --rm --no-deps runner-test \
            sh -c 'google-chrome --version && microsoft-edge --version && node --version'
      - name: Verify PKI and seed data
        run: |
          ./lab pki verify
          database_before=$(docker compose -f infra/compose.yaml ps -q postgres)
          test -n "$database_before"
          ./lab db verify
          test "$database_before" = "$(docker compose -f infra/compose.yaml ps -q postgres)"
          ./lab healthcheck
      - name: Gate on live OpenAPI contracts and operation coverage
        run: ./lab test --runner playwright --suite contracts
      - name: Run live TLS, token, identity and ownership checks
        run: ./lab test --runner playwright --suite security
      - name: Run both runners in real Chrome and Edge with customer and admin identities
        run: |
          set -eu
          for browser in chrome msedge; do
            for runner in playwright cucumber; do
              for user in customer-waterdeep shop-admin; do
                ./lab test --runner "$runner" --browser "$browser" --user "$user"
              done
            done
          done
      - name: Scan only local reports for credential material
        id: scan
        if: always()
        run: |
          if [ ! -d artifacts/contracts ] && [ ! -d artifacts/teaching ]; then exit 1; fi
          docker run --rm --platform linux/amd64 --entrypoint node \
            -v "$PWD/artifacts:/work/artifacts:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs /work/artifacts/.
      - name: Verify approved text reports are readable by the CI runner
        id: readable
        if: always() && steps.scan.outcome == 'success'
        run: |
          set -eu
          for file in artifacts/contracts/*/junit.xml artifacts/teaching/*/junit.xml \
            artifacts/teaching/*/cucumber.json artifacts/teaching/*/scenario-telemetry.jsonl \
            artifacts/contract-coverage.json; do
            if [ -e "$file" ]; then test -r "$file"; fi
          done
      - name: Upload scanned text-only contract and teaching results
        if: always() && steps.scan.outcome == 'success' && steps.readable.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magic-shop-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/contracts/*/junit.xml
            artifacts/teaching/*/junit.xml
            artifacts/teaching/*/cucumber.json
            artifacts/teaching/*/scenario-telemetry.jsonl
            artifacts/contract-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this CI project's containers and volumes
        if: always()
        run: ./lab reset --project "$LAB_PROJECT"

  certificate-password:
    name: Native certificate and password teaching matrix
    needs: [javascript, services, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LAB_PROJECT: magic-shop-password-ci-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_PASSWORD_REPORTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start disposable live teaching stack
        run: ./lab up
      - name: Run all 36 live certificate-password cases
        run: sh testing/run-certificate-password.sh
      - name: Require all 36 live cases without omissions
        id: password_matrix
        if: always()
        run: |
          set -eu
          report_dir="$PWD/artifacts/certificate-password-ci/$LAB_PROJECT"
          docker run --rm --platform linux/amd64 --entrypoint node \
            -v "$report_dir:/work/artifacts/certificate-password-ci:ro" magic-shop-runner:03 \
            /work/testing/reporting/check-password-matrix.mjs
      - name: Scan safe reports and verify CI host readability
        id: password_scan
        if: always()
        run: |
          set -eu
          report_dir="$PWD/artifacts/certificate-password-ci/$LAB_PROJECT"
          test -d "$report_dir"
          docker run --rm --platform linux/amd64 --entrypoint node \
            -v "$report_dir:/work/artifacts/certificate-password-ci:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs /work/artifacts/certificate-password-ci
          readable=0
          for selection in chrome-playwright chrome-cucumber msedge-playwright msedge-cucumber; do
            if [ -d "$report_dir/$selection" ]; then
              test -r "$report_dir/$selection/junit.xml"
              test -r "$report_dir/$selection/results.json"
              readable=$((readable + 1))
            fi
          done
          test "$readable" -gt 0
      - name: Upload scanned teaching reports and privacy-screened recordings
        if: always() && steps.password_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certificate-password-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certificate-password-ci/${{ env.LAB_PROJECT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Remove and verify successful matrix resources
        if: always()
        timeout-minutes: 5
        run: sh testing/cleanup-certificate-password.sh
      - name: Prove fixture cleanup after an intentional runner failure
        env:
          LAB_PROJECT: magic-shop-password-failure-${{ github.run_id }}-${{ github.run_attempt }}
          LAB_PASSWORD_REPORTS: "0"
        run: |
          set -eu
          ./lab up
          set +e
          LAB_PASSWORD_FORCE_FAILURE=1 sh testing/run-certificate-password.sh > "$RUNNER_TEMP/teaching-failure.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/teaching-failure.txt"
          test "$result" -eq 1
          grep -Fx "Intentional teaching runner failure observed" "$RUNNER_TEMP/teaching-failure.txt"
          docker compose -f infra/compose.yaml -f infra/teaching.compose.yaml \
            run --rm --no-deps teaching-fixture verify
      - name: Always remove and verify both disposable teaching projects
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          sh testing/cleanup-certificate-password.sh
          main_result=$?
          LAB_PROJECT="magic-shop-password-failure-${{ github.run_id }}-${{ github.run_attempt }}" \
            sh testing/cleanup-certificate-password.sh
          failure_result=$?
          test "$main_result" -eq 0 && test "$failure_result" -eq 0

  consumer:
    name: Contract-derived mock consumers (Prism)
    needs: [javascript, services, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_MOCK_PLATFORM: linux/amd64
      CI_FORCE_FAILURE_SUITE: ${{ github.event.inputs.evidence_failure_suite || 'none' }}
      CI_SUITE: consumer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run independent evidence suite in pinned containers
        id: suite_run
        run: ./testing/ci/run-isolated.sh "$CI_SUITE"
      - name: Prove cleanup after an intentional suite failure
        id: failure_probe
        run: ./testing/ci/probe-failure.sh "$CI_SUITE"
      - name: Always dispose and independently verify both projects
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: ./testing/ci/cleanup-isolated.sh "$CI_SUITE"
      - name: Prepare, scan and verify allowlisted text reports
        id: evidence_scan
        if: always()
        env:
          CI_RUN_OUTCOME: ${{ steps.suite_run.outcome }}
          CI_PROBE_OUTCOME: ${{ steps.failure_probe.outcome }}
        run: |
          set -eu
          mkdir -p "artifacts/ci-evidence/$CI_SUITE"
          chmod 0777 "artifacts/ci-evidence/$CI_SUITE"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -e GITHUB_ACTIONS -v "$PWD:/work:ro" \
            -v "$PWD/artifacts/ci-evidence/$CI_SUITE:/work/artifacts/ci-evidence/$CI_SUITE" magic-shop-runner:03 \
            /work/testing/ci/report.mjs "$CI_SUITE" "$CI_EVIDENCE_ID" "$CI_RUN_OUTCOME" "$CI_PROBE_OUTCOME"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD:/work:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs "/work/artifacts/ci-evidence/$CI_SUITE"
          for file in $(find "artifacts/ci-evidence/$CI_SUITE" -type f); do test -r "$file"; done
      - name: Upload separate scanned evidence text report
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ env.CI_SUITE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-evidence/${{ env.CI_SUITE }}/
          if-no-files-found: error
          retention-days: 7

  dependency-faults:
    name: Dependency faults (${{ matrix.suite }})
    needs: [javascript, services, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [checkout, reporting, idempotency]
    env:
      CI_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_MOCK_PLATFORM: linux/amd64
      CI_FORCE_FAILURE_SUITE: ${{ github.event.inputs.evidence_failure_suite || 'none' }}
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run independent evidence suite in pinned containers
        id: suite_run
        run: ./testing/ci/run-isolated.sh "$CI_SUITE"
      - name: Prove cleanup after an intentional suite failure
        id: failure_probe
        run: ./testing/ci/probe-failure.sh "$CI_SUITE"
      - name: Always dispose and independently verify both projects
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: ./testing/ci/cleanup-isolated.sh "$CI_SUITE"
      - name: Prepare, scan and verify allowlisted text reports
        id: evidence_scan
        if: always()
        env:
          CI_RUN_OUTCOME: ${{ steps.suite_run.outcome }}
          CI_PROBE_OUTCOME: ${{ steps.failure_probe.outcome }}
        run: |
          set -eu
          mkdir -p "artifacts/ci-evidence/$CI_SUITE"
          chmod 0777 "artifacts/ci-evidence/$CI_SUITE"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -e GITHUB_ACTIONS -v "$PWD:/work:ro" \
            -v "$PWD/artifacts/ci-evidence/$CI_SUITE:/work/artifacts/ci-evidence/$CI_SUITE" magic-shop-runner:03 \
            /work/testing/ci/report.mjs "$CI_SUITE" "$CI_EVIDENCE_ID" "$CI_RUN_OUTCOME" "$CI_PROBE_OUTCOME"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD:/work:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs "/work/artifacts/ci-evidence/$CI_SUITE"
          for file in $(find "artifacts/ci-evidence/$CI_SUITE" -type f); do test -r "$file"; done
      - name: Upload separate scanned evidence text report
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ env.CI_SUITE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-evidence/${{ env.CI_SUITE }}/
          if-no-files-found: error
          retention-days: 7

  regional:
    name: Real-provider regional boundaries
    needs: [javascript, services, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      REPORTING_MOCK_PLATFORM: linux/amd64
      CI_FORCE_FAILURE_SUITE: ${{ github.event.inputs.evidence_failure_suite || 'none' }}
      CI_SUITE: regional
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run independent evidence suite in pinned containers
        id: suite_run
        run: ./testing/ci/run-isolated.sh "$CI_SUITE"
      - name: Prove cleanup after an intentional suite failure
        id: failure_probe
        run: ./testing/ci/probe-failure.sh "$CI_SUITE"
      - name: Always dispose and independently verify both projects
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: ./testing/ci/cleanup-isolated.sh "$CI_SUITE"
      - name: Prepare, scan and verify allowlisted text reports
        id: evidence_scan
        if: always()
        env:
          CI_RUN_OUTCOME: ${{ steps.suite_run.outcome }}
          CI_PROBE_OUTCOME: ${{ steps.failure_probe.outcome }}
        run: |
          set -eu
          mkdir -p "artifacts/ci-evidence/$CI_SUITE"
          chmod 0777 "artifacts/ci-evidence/$CI_SUITE"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -e GITHUB_ACTIONS -v "$PWD:/work:ro" \
            -v "$PWD/artifacts/ci-evidence/$CI_SUITE:/work/artifacts/ci-evidence/$CI_SUITE" magic-shop-runner:03 \
            /work/testing/ci/report.mjs "$CI_SUITE" "$CI_EVIDENCE_ID" "$CI_RUN_OUTCOME" "$CI_PROBE_OUTCOME"
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD:/work:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs "/work/artifacts/ci-evidence/$CI_SUITE"
          for file in $(find "artifacts/ci-evidence/$CI_SUITE" -type f); do test -r "$file"; done
      - name: Upload separate scanned evidence text report
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ env.CI_SUITE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-evidence/${{ env.CI_SUITE }}/
          if-no-files-found: error
          retention-days: 7

  password-otp:
    name: Password and OTP in Chrome/Edge and both runners
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LAB_PROJECT: magic-shop-otp-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run all 48 password and OTP baseline/session cases across both runners
        run: sh testing/run-password-otp.sh
      - name: Scan credential-safe reports
        id: otp_scan
        if: always()
        run: |
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD/artifacts/password-otp/$LAB_PROJECT:/work/artifacts/password-otp:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs /work/artifacts/password-otp
      - name: Upload scanned lesson reports
        if: always() && steps.otp_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: password-otp-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/password-otp/${{ env.LAB_PROJECT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable stack on failure or cancellation
        if: always()
        run: |
          export LAB_OTP_REPORT_DIR="$PWD/artifacts/password-otp/$LAB_PROJECT"
          docker compose -f infra/compose.yaml -f infra/otp.compose.yaml --profile '*' down --volumes --remove-orphans --timeout 10

  auth-lessons:
    name: All authentication protocols in both runners
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LAB_PROJECT: magic-shop-auth-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run real Chrome and Edge lesson matrix
        run: sh testing/run-auth-lessons.sh
      - name: Scan credential-safe reports
        id: auth_scan
        if: always()
        run: |
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD/artifacts/auth-lessons/$LAB_PROJECT:/work/artifacts/auth-lessons:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs /work/artifacts/auth-lessons
      - name: Upload scanned lesson reports
        if: always() && steps.auth_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-lessons-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/auth-lessons/${{ env.LAB_PROJECT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable stack on failure or cancellation
        if: always()
        run: |
          export LAB_AUTH_REPORT_DIR="$PWD/artifacts/auth-lessons/$LAB_PROJECT"
          docker compose -f infra/compose.yaml -f infra/auth-lessons.compose.yaml --profile '*' down --volumes --remove-orphans --timeout 10

  authentik:
    name: Authentik OIDC and SAML in both runners
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LAB_PROJECT: magic-shop-authentik-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run pinned real authentik provider matrix
        run: sh testing/run-authentik.sh
      - name: Scan provider reports and recordings
        run: |
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -v "$PWD/artifacts/authentik/$LAB_PROJECT:/work/artifacts/auth-lessons:ro" magic-shop-runner:03 \
            /work/testing/container/check-artifacts.mjs /work/artifacts/auth-lessons
      - name: Upload scanned authentik evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authentik-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/authentik/${{ env.LAB_PROJECT }}/
          if-no-files-found: error
      - name: Always remove and verify disposable provider resources
        if: always()
        run: |
          docker compose -f infra/compose.yaml -f infra/auth-lessons.compose.yaml -f infra/authentik.compose.yaml --profile '*' down --volumes --remove-orphans --timeout 10
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$LAB_PROJECT)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$LAB_PROJECT)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=$LAB_PROJECT)"

  operator-tests:
    name: Native Go operator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test all operator packages in the pinned Go container
        run: |
          docker run --rm -v "$PWD/operator:/src:ro" -w /src \
            golang:1.26.0-bookworm@sha256:2a0ba12e116687098780d3ce700f9ce3cb340783779646aafbabed748fa6677c \
            go test -mod=readonly ./...

  browser-recordings:
    name: Complete recorded browser matrix (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [debian, ubi9]
    env:
      LAB_PROJECT: magic-shop-matrix-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_CI_REPORTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the selected runner before starting live services
        env:
          LAB_RUNNER_OS: ${{ matrix.os }}
        run: |
          if [ "$LAB_RUNNER_OS" = ubi9 ]; then
            export LAB_RUNNER_IMAGE=magic-shop-runner-ubi9:01
            export LAB_RUNNER_CONTAINERFILE=testing/container/Runner.ubi9.Containerfile
          fi
          docker compose -f infra/compose.yaml --profile test build runner-test
      - name: Start disposable lab
        run: ./lab up
      - name: Record every supported user, runner, browser and suite
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: ./lab matrix --os "$MATRIX_OS"
      - name: Show safe failed-selection identifiers
        if: failure()
        run: |
          docker run --rm --network none --entrypoint node -v "$PWD:/work:ro" \
            node:24.10.0-bookworm-slim@sha256:b8d2197aff9129d16c801a3e3e1b2a873c4946480f5a310f38056df2268c38d9 \
            --input-type=module -e '
            import {readdirSync,readFileSync,existsSync} from "node:fs";
            const root="/work/artifacts/matrix";
            if(existsSync(root))for(const name of readdirSync(root)){
              const matrix=JSON.parse(readFileSync(root+"/"+name+"/matrix.json"));
              for(const row of matrix.rows.filter(r=>r.status!=="passed")){
                console.log(JSON.stringify({os:row.os,browser:row.browser,runner:row.runner,user:row.user,suite:row.suite,status:row.status,summary:row.summary}));
              }
            }'
      - name: Verify full inventory and scan recordings
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          docker run --rm --network none --entrypoint node \
            -v "$PWD:/work:ro" node:24.10.0-bookworm-slim@sha256:b8d2197aff9129d16c801a3e3e1b2a873c4946480f5a310f38056df2268c38d9 \
            /work/testing/reporting/check-browser-matrix.mjs /work/artifacts "$MATRIX_OS"
          docker run --rm --network none --entrypoint node \
            -v "$PWD:/work:ro" node:24.10.0-bookworm-slim@sha256:b8d2197aff9129d16c801a3e3e1b2a873c4946480f5a310f38056df2268c38d9 \
            /work/testing/container/check-artifacts.mjs /work/artifacts
      - name: Remove owned lab resources and verify cleanup
        run: sh testing/cleanup-certificate-password.sh
      - name: Save cleanup evidence
        run: echo 'Owned browser-matrix resources removed and independently verified.' > artifacts/matrix-cleanup.txt
      - name: Upload complete scanned browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/matrix/
            artifacts/teaching/
            artifacts/playwright/
            artifacts/matrix-cleanup.txt
          if-no-files-found: error
          retention-days: 30
      - name: Always remove owned resources after failure or cancellation
        if: always()
        run: sh testing/cleanup-certificate-password.sh

  evidence-gates:
    name: Require independent live, consumer and fault gates
    needs: [integration, certificate-password, password-otp, auth-lessons, authentik, consumer, dependency-faults, regional, operator-tests, browser-recordings]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned gate runner
        run: docker build --platform linux/amd64 --target base -t magic-shop-ci-base:local -f infra/ci/Containerfile .
      - name: Reject missing, skipped, failed or cancelled required gates
        env:
          CI_GATE_RESULTS: ${{ toJSON(needs) }}
          CI_FULL_EVIDENCE: ${{ inputs.full_evidence && '1' || '0' }}
        run: |
          docker run --rm --platform linux/amd64 --network none --entrypoint node \
            -e CI_GATE_RESULTS -e CI_FULL_EVIDENCE magic-shop-ci-base:local /work/testing/ci/check-gates.mjs
