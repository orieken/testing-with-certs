                "schema": {
                  "$ref": "./shared/schemas.yaml#/components/schemas/Error"
                }
              }
            },
            "x-error-code": "dependency_unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "description": "Item IDs, quantities and selected region only; prices/totals forbidden.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CheckoutRequest"
              }
            }
          }
        }
      }
