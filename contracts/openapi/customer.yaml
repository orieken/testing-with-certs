{
  "openapi": "3.1.0",
  "info": {
    "title": "Magic Shop customer API",
    "version": "0.1.0",
    "description": "Node-owned profiles, orders, widgets and a private revision-pinned reporting feed. Ownership is derived from token sub."
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "servers": [
    {
      "url": "https://shop.magic.test:8443",
      "description": "Public HAProxy gateway; human certificate required."
    }
  ],
  "security": [
    {
      "clientCertificate": [],
      "accessToken": []
    }
  ],
  "components": {
    "securitySchemes": {
      "clientCertificate": {
        "type": "mutualTLS",
        "description": "Caller certificate verified at the gateway (public) or service listener (private)."
      },
      "accessToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Keycloak access token, exact issuer https://auth.magic.test:9443/realms/magic-shop; ID tokens rejected."
      }
    },
    "schemas": {
      "Profile": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sub",
          "displayName",
          "regionId",
          "location"
        ],
        "properties": {
          "sub": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Subject"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "regionId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/RegionId"
          },
          "location": {
            "$ref": "./shared/schemas.yaml#/components/schemas/LonLat"
          }
        }
      },
      "ProfilePatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "regionId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/RegionId"
          },
          "location": {
            "$ref": "./shared/schemas.yaml#/components/schemas/LonLat"
          }
        },
        "minProperties": 1
      },
      "CheckoutLine": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "itemId",
          "quantity"
        ],
        "properties": {
          "itemId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Id"
          },
          "quantity": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Quantity"
          }
        }
      },
      "CheckoutRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "regionId",
          "lines"
        ],
        "properties": {
          "regionId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/RegionId"
          },
          "lines": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CheckoutLine"
            },
            "maxItems": 50,
            "minItems": 1
          }
        }
      },
      "OrderLine": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "itemId",
          "name",
          "unitPriceCopper",
          "quantity",
          "lineTotalCopper"
        ],
        "properties": {
          "itemId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Id"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "unitPriceCopper": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Copper"
          },
          "quantity": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Quantity"
          },
          "lineTotalCopper": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Copper"
          }
        }
      },
      "Order": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "orderId",
          "ownerSub",
          "regionId",
          "status",
          "createdAt",
          "completedAt",
          "lines",
          "totalCopper"
        ],
        "properties": {
          "orderId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Id"
          },
          "ownerSub": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Subject"
          },
          "regionId": {
            "$ref": "./shared/schemas.yaml#/components/schemas/RegionId"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "completed",
              "cancelled"
            ]
          },
          "createdAt": {
            "$ref": "./shared/schemas.yaml#/components/schemas/UtcTimestamp"
          },
          "completedAt": {
            "anyOf": [
              {
                "$ref": "./shared/schemas.yaml#/components/schemas/UtcTimestamp"
              },
              {
                "type": "null"
              }
            ]
          },
          "lines": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrderLine"
            },
            "maxItems": 50,
            "minItems": 1
          },
          "totalCopper": {
            "$ref": "./shared/schemas.yaml#/components/schemas/Copper"
          }
        }
      },
      "OrderPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Order"
            },
            "maxItems": 100
          },
          "nextCursor": {
            "anyOf": [
              {
                "$ref": "./shared/schemas.yaml#/components/schemas/Cursor"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "WidgetLayout": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "widgetIds"
        ],
        "properties": {
          "widgetIds": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "recent-orders",
                "total-sales",
                "sales-by-region",
                "recent-admin-orders",
                "customer-list"
              ]
            },
            "maxItems": 10,
            "uniqueItems": true
          }
        }
      },
      "ProfilePage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Profile"
            },
            "maxItems": 100
          },
          "nextCursor": {
            "anyOf": [
              {
                "$ref": "./shared/schemas.yaml#/components/schemas/Cursor"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "ReportingRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "order",
          "customer"
        ],
        "properties": {
          "order": {
            "$ref": "#/components/schemas/Order"
          },
          "customer": {
            "$ref": "#/components/schemas/Profile"
          }
        }
      },
      "ReportingPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "items",
          "nextCursor"
        ],
        "properties": {
          "revision": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ReportingRecord"
            },
            "maxItems": 100
          },
          "nextCursor": {
            "anyOf": [
              {
                "$ref": "./shared/schemas.yaml#/components/schemas/Cursor"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      }
    }
  },
