{
  "openapi": "3.1.0",
  "info": {
    "title": "Magic Shop shared transport schemas",
    "version": "0.1.0",
    "description": "Reusable schemas; not a standalone HTTP service."
  },
  "paths": {},
  "components": {
    "schemas": {
      "Id": {
        "type": "string",
        "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
        "maxLength": 64
      },
      "Subject": {
        "type": "string",
        "format": "uuid"
      },
      "RegionId": {
        "type": "string",
        "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
        "maxLength": 64
      },
      "UtcTimestamp": {
        "type": "string",
        "format": "date-time",
        "pattern": "Z$"
      },
      "Copper": {
        "type": "integer",
        "format": "int64",
        "minimum": 0,
        "maximum": 9007199254740991
      },
      "Quantity": {
        "type": "integer",
        "minimum": 1,
        "maximum": 100
      },
      "Cursor": {
        "type": "string",
        "minLength": 1,
        "maxLength": 512
      },
      "PageInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nextCursor"
        ],
        "properties": {
          "nextCursor": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_]{2,63}$"
          },
          "message": {
            "type": "string",
            "minLength": 1,
            "maxLength": 240
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          }
        }
      },
      "LonLat": {
        "type": "array",
        "prefixItems": [
          {
            "type": "number",
            "minimum": -180,
            "maximum": 180
          },
          {
            "type": "number",
            "minimum": -90,
            "maximum": 90
          }
        ],
        "minItems": 2,
        "maxItems": 2,
        "items": false
      }
    }
  }
}
